name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout MoneroKit.Swift
        uses: actions/checkout@v7
        with:
          repository: bwgh0/MoneroKit.Swift
          path: MoneroKit.Swift
          # Need real `.a` content from LFS, not the pointer files.
          lfs: true

      - name: Fix MoneroKit path for CI
        run: |
          sed -i '' 's|\.\./MoneroKit\.Swift|MoneroKit.Swift|g' MoneroOne.xcodeproj/project.pbxproj

      # A wallet2 library rebuild that drops a symbol the wallet-creation
      # paths need must fail here — never get stubbed past the linker
      # (that's how the May 2026 BIP39 null-key burn bug shipped).
      - name: Verify wallet library ABI
        run: |
          bash MoneroKit.Swift/scripts/check_wallet_abi.sh

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MoneroOne.xcodeproj \
            -scheme MoneroOne

      - name: Build for simulator
        run: |
          xcodebuild -project MoneroOne.xcodeproj \
            -scheme MoneroOne \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug \
            build

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project MoneroOne.xcodeproj \
            -scheme MoneroOne \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -only-testing:MoneroOneTests \
            -skip-testing:MoneroOneTests/GethashesDeviceDiagTests

      - name: Run MoneroKit tests
        working-directory: MoneroKit.Swift
        run: |
          xcodebuild test \
            -scheme "MoneroKit.swift" \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro"
