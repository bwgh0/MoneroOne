# ============================================================================
# WARNING: project.pbxproj is HAND-MAINTAINED. Do not run `xcodegen generate`.
#
# The committed pbxproj carries hand edits this file cannot reproduce:
#   - the Icon Composer app icon (`monero-one.icon`, APPICON_NAME
#     "monero-one") — xcodegen doesn't understand .icon bundles and regen
#     breaks the installed app icon
#   - manually registered test files (grep CAC4E1D0 / REGR3SS10N)
# To add a file: copy an existing PBXBuildFile + PBXFileReference pair in
# the pbxproj, mint a unique 24-hex UUID, add it to the group children and
# the target's Sources phase.
# The deploymentTarget/plist settings below were re-synced to the shipped
# pbxproj on 2026-07-29 to limit damage IF someone regens anyway.
# ============================================================================
name: MoneroOne
options:
  bundleIdPrefix: one.monero
  # 17.0 is load-bearing: raising this drops every user below that iOS
  # version (and the App Store build's minos must stay 17.0 — CI verifies
  # it post-archive). Keep in sync with the -miphoneos-version-min guard
  # in monero_c_build/build_ios_trezor.sh.
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  MoneroKit:
    path: ../MoneroKit.Swift
  HdWalletKit:
    url: https://github.com/horizontalsystems/HdWalletKit.Swift.git
    exactVersion: 1.3.0

targets:
  MoneroOne:
    type: application
    platform: iOS
    sources:
      - MoneroOne
      - Shared
    dependencies:
      - package: MoneroKit
      - package: HdWalletKit
      - target: MoneroOneWidgets
        embed: true
    # No `info:` block on purpose: xcodegen would rewrite the plist from the
    # (stale) properties listed here on every generate, silently dropping
    # hand-maintained keys — it already ate NSBluetoothAlwaysUsageDescription
    # and the bluetooth-central background mode once (Trezor BLE crashes
    # without them). The committed Info.plist is the source of truth.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MoneroOne/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: monero-one
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MoneroOneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MoneroOneWidgets
      - Shared
    # See MoneroOne target: committed Info.plist is source of truth, no
    # `info:` generation.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MoneroOneWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: one.monero.MoneroOne.WidgetsExtension
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  MoneroOneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MoneroOneTests
    dependencies:
      - target: MoneroOne
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  MoneroOneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MoneroOneUITests
    dependencies:
      - target: MoneroOne
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: MoneroOne

schemes:
  MoneroOne:
    build:
      targets:
        MoneroOne: all
        MoneroOneTests: [test]
        MoneroOneUITests: [test]
    test:
      targets:
        - MoneroOneTests
        - MoneroOneUITests
